name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static site files
        run: |
          test -f index.html
          node --check js/sorting.js
          node --check js/pathfinding.js
          node --check js/main.js
          echo "AlgoVisual static check passed"
